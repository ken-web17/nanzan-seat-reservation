<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【運営用】南山生 座席予約管理システム</title>
  <link rel="stylesheet" href="style.css">
  <!-- QRコード読み取り用ライブラリ (Html5-QRCode) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="admin-body">
  <div class="admin-container">
    <header class="admin-header">
      <h1>講演会 運営用管理ダッシュボード</h1>
      <button onclick="loadData()" class="refresh-btn">🔄 最新データを再読み込み</button>
    </header>

    <!-- メイングリッド (左: QRスキャナー & シートマップ / 右: 予約管理リスト) -->
    <div class="admin-grid">
      
      <!-- 左カラム: カメラ受付 & シートマップ -->
      <div class="admin-col">
        <!-- 1. QRスキャナー -->
        <div class="admin-card">
          <h2>QRコード受付スキャン</h2>
          <div id="reader" style="width: 100%;"></div>
          <div id="scanResult" class="scan-result-box hidden"></div>
        </div>

        <!-- 2. シートマップ状況 -->
        <div class="admin-card">
          <h2>リアルタイム座席状況</h2>
          <div class="legend">
            <span class="legend-item"><span class="box free"></span> 空席</span>
            <span class="legend-item"><span class="box reserved"></span> 予約済</span>
            <span class="legend-item"><span class="box checked"></span> 受付済</span>
          </div>
          <div id="adminSeatMap" class="seat-map admin-map"></div>
        </div>
      </div>

      <!-- 右カラム: 予約一覧テーブル & 手動操作 -->
      <div class="admin-col">
        <div class="admin-card">
          <div class="card-header">
            <h2>予約データ一覧 (<span id="totalCount">0</span>件)</h2>
            <input type="text" id="searchInput" oninput="filterTable()" placeholder="名前・学籍番号・座席で検索..." class="search-box">
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>予約番号</th>
                  <th>氏名 (ふりがな)</th>
                  <th>所属</th>
                  <th>学籍番号</th>
                  <th>座席</th>
                  <th>状態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="reservationTableBody">
                <tr><td colspan="7" style="text-align:center;">データを読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ★ご自身のGAS WebアプリURLに差し替えてください★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxpf73U1yPf3frEY7E6NXVJoDPqou0GVhUC2YU19fDC8Wve9jB2jFfyh3D_2MBSt5PsnA/exec";

    let allReservations = [];
    let html5QrcodeScanner;

    window.onload = () => {
      loadData();
      initScanner();
    };

    // データの読み込み
    async function loadData() {
      try {
        const res = await fetch(GAS_API_URL);
        allReservations = await res.json();
        renderTable(allReservations);
        renderAdminSeatMap();
      } catch (err) {
        alert("データの取得に失敗しました。");
      }
    }

    // テーブル描画
    function renderTable(data) {
      const tbody = document.getElementById('reservationTableBody');
      tbody.innerHTML = '';

      const activeData = data.filter(r => r['ステータス'] !== 'キャンセル');
      document.getElementById('totalCount').innerText = activeData.length;

      data.forEach(item => {
        const tr = document.createElement('tr');
        if (item['ステータス'] === 'キャンセル') tr.className = 'status-cancelled-row';

        let statusClass = 'badge-reserved';
        if (item['ステータス'] === '受付済') statusClass = 'badge-checked';
        if (item['ステータス'] === 'キャンセル') statusClass = 'badge-cancelled';

        tr.innerHTML = `
          <td><strong>${item['予約番号']}</strong></td>
          <td>${item['姓']} ${item['名']}<br><small>(${item['セイ']} ${item['メイ']})</small></td>
          <td>${item['学年']}-${item['クラス']}</td>
          <td>${item['学籍番号']}</td>
          <td><strong class="seat-tag">${item['座席番号']}</strong></td>
          <td><span class="badge ${statusClass}">${item['ステータス']}</span></td>
          <td>
            ${item['ステータス'] === '予約済' ? `<button onclick="updateStatus('${item['予約番号']}', '受付済')" class="btn-sm btn-check">手動受付</button>` : ''}
            ${item['ステータス'] !== 'キャンセル' ? `<button onclick="updateStatus('${item['予約番号']}', 'キャンセル')" class="btn-sm btn-cancel">キャンセル</button>` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 検索フィルター
    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allReservations.filter(r => {
        return (r['姓'] + r['名']).toLowerCase().includes(query) ||
               (r['セイ'] + r['メイ']).toLowerCase().includes(query) ||
               String(r['学籍番号']).includes(query) ||
               String(r['座席番号']).toLowerCase().includes(query) ||
               String(r['予約番号']).toLowerCase().includes(query);
      });
      renderTable(filtered);
    }

    // 管理者シートマップ描画
    function renderAdminSeatMap() {
      const seatMap = document.getElementById('adminSeatMap');
      seatMap.innerHTML = '';

      const seatStatusMap = {};
      allReservations.forEach(r => {
        if (r['ステータス'] !== 'キャンセル') {
          seatStatusMap[r['座席番号']] = r['ステータス'];
        }
      });

      const rows = ['A', 'B', 'C'];
      rows.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'seat-row';

        for (let col = 1; col <= 10; col++) {
          const seatId = `${row}-${col}`;
          const seatBox = document.createElement('div');
          seatBox.className = 'admin-seat-box';
          seatBox.innerText = seatId;

          if (col % 2 === 0 && col !== 10) seatBox.classList.add('aisle-right');

          const status = seatStatusMap[seatId];
          if (status === '予約済') seatBox.classList.add('reserved');
          else if (status === '受付済') seatBox.classList.add('checked');
          else seatBox.classList.add('free');

          rowDiv.appendChild(seatBox);
        }
        seatMap.appendChild(rowDiv);
      });
    }

    // スキャン処理
    function initScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess);
    }

    async function onScanSuccess(decodedText) {
      const resultBox = document.getElementById('scanResult');
      resultBox.classList.remove('hidden', 'success', 'error');
      resultBox.innerText = "照合中...";

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkIn", reservationId: decodedText })
        });
        const result = await res.json();

        if (result.success) {
          resultBox.classList.add('success');
          const data = result.data;
          resultBox.innerHTML = `
            <h3>⭕ 受付完了！</h3>
            <p><strong>${data[1]} ${data[2]} 様</strong> (${data[5]}-${data[6]} / 座席: ${data[9]})</p>
          `;
          loadData(); // 画面更新
        } else {
          resultBox.classList.add('error');
          resultBox.innerHTML = `<h3>❌ エラー</h3><p>${result.message}</p>`;
        }
      } catch (err) {
        resultBox.classList.add('error');
        resultBox.innerText = "通信エラーが発生しました。";
      }
    }

    // ステータス手動変更
    async function updateStatus(resId, newStatus) {
      if (!confirm(`予約番号 ${resId} を「${newStatus}」に変更しますか？`)) return;

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "adminUpdate", reservationId: resId, status: newStatus })
        });
        const result = await res.json();
        if (result.success) {
          loadData();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (err) {
        alert("通信エラーが発生しました。");
      }
    }
  </script>
</body>
</html>
