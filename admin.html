<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席予約 管理者ページ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f9; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    .refresh-btn { padding: 8px 16px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #f8f9fa; }
    .status-reserved { color: green; font-weight: bold; }
    .status-cancelled { color: red; font-weight: bold; }
    .cancel-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>座席予約 管理者モニタリング</h1>
    <button class="refresh-btn" onclick="loadData()">最新データに更新</button>
    
    <table>
      <thead>
        <tr>
          <th>予約ID</th>
          <th>座席</th>
          <th>氏名</th>
          <th>学年・クラス</th>
          <th>学籍番号</th>
          <th>生年月日</th>
          <th>ステータス</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="reservationTable">
        <tr><td colspan="8">データを読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const GITHUB_OWNER = "ken-web17";
    const GITHUB_REPO = "nanzan-seat-reservation";
    const GITHUB_BRANCH = "main";
    const FILE_PATH = "data.json";
    
    // ⚠️ ここに「再発行した新しいPAT」を貼り付けてください
    const GITHUB_TOKEN = "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";

    const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

    async function loadData() {
      const tbody = document.getElementById('reservationTable');
      tbody.innerHTML = '<tr><td colspan="8">データを読み込み中...</td></tr>';

      try {
        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${FILE_PATH}?t=${Date.now()}`;
        const res = await fetch(rawUrl);
        const data = await res.json();

        tbody.innerHTML = '';
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8">予約データはありません。</td></tr>';
          return;
        }

        data.forEach(item => {
          const tr = document.createElement('tr');
          const isCancelled = item.status === 'cancelled';
          
          tr.innerHTML = `
            <td>${item.reservationId}</td>
            <td><strong>${item.seat}</strong></td>
            <td>${item.lastName} ${item.firstName} (${item.lastKana} ${item.firstKana})</td>
            <td>${item.grade} ${item.className}</td>
            <td>${item.studentId}</td>
            <td>${item.birthdate}</td>
            <td class="${isCancelled ? 'status-cancelled' : 'status-reserved'}">
              ${isCancelled ? 'キャンセル済' : '予約中'}
            </td>
            <td>
              ${!isCancelled ? `<button class="cancel-btn" onclick="forceCancel('${item.reservationId}')">強制キャンセル</button>` : '-'}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="8">データの取得に失敗しました。PATの設定などを確認してください。</td></tr>';
      }
    }

    async function forceCancel(resId) {
      if (!confirm("この予約を管理者権限で強制キャンセルしますか？")) return;

      try {
        const getRes = await fetch(API_URL, {
          headers: { "Authorization": `token ${GITHUB_TOKEN}` }
        });
        const fileMetaData = await getRes.json();
        const currentContent = JSON.parse(decodeURIComponent(escape(window.atob(fileMetaData.content.replace(/\n/g, '')))));

        const target = currentContent.find(item => item.reservationId === resId);
        if (target) {
          target.status = 'cancelled';
          target.cancelledAt = new Date().toISOString();
        }

        const encodedContent = window.btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

        await fetch(API_URL, {
          method: "PUT",
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `管理者による強制キャンセル: ${resId}`,
            content: encodedContent,
            sha: fileMetaData.sha,
            branch: GITHUB_BRANCH
          })
        });

        alert("キャンセル処理が完了しました。");
        loadData();
      } catch (err) {
        alert("キャンセルの処理に失敗しました。");
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
