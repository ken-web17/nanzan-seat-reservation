<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南山座席予約システム</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f6f9; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
    .seat { padding: 15px; border: 1px solid #ccc; text-align: center; border-radius: 5px; cursor: pointer; background-color: #e9ecef; font-weight: bold; }
    .seat.selected { background-color: #0d6efd; color: white; }
    .seat.reserved { background-color: #dc3545; color: white; cursor: not-allowed; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background-color: #198754; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    .loading-msg { text-align: center; color: #666; font-size: 14px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>座席予約システム</h1>
    <div id="statusMsg" class="loading-msg">データを読み込み中...</div>
    
    <h3>1. 座席を選択してください</h3>
    <div class="seat-grid" id="seatGrid">
      <!-- JavaScriptで座席を自動生成 -->
    </div>

    <h3>2. 予約者情報を入力してください</h3>
    <form id="reservationForm">
      <div class="form-group">
        <label>選択した座席:</label>
        <input type="text" id="selectedSeat" readonly placeholder="座席を選択してください">
      </div>
      <div class="form-group">
        <label>姓:</label>
        <input type="text" id="lastName" required placeholder="例: 南山">
      </div>
      <div class="form-group">
        <label>名:</label>
        <input type="text" id="firstName" required placeholder="例: 太郎">
      </div>
      <div class="form-group">
        <label>セイ（フリガナ）:</label>
        <input type="text" id="lastKana" required placeholder="例: ナンザン">
      </div>
      <div class="form-group">
        <label>メイ（フリガナ）:</label>
        <input type="text" id="firstKana" required placeholder="例: タロウ">
      </div>
      <div class="form-group">
        <label>学年・クラス:</label>
        <input type="text" id="gradeClass" required placeholder="例: 2年A組">
      </div>
      <div class="form-group">
        <label>学籍番号:</label>
        <input type="text" id="studentId" required placeholder="例: 20240001">
      </div>
      <div class="form-group">
        <label>生年月日:</label>
        <input type="date" id="birthdate" required>
      </div>

      <button type="button" id="submitBtn" onclick="submitReservation()">予約を確定する</button>
    </form>
  </div>

  <script>
    // ==========================================
    //  GitHub 構成設定
    // ==========================================
    const GITHUB_OWNER = "ken-web17";
    const GITHUB_REPO = "nanzan-seat-reservation";
    const GITHUB_BRANCH = "main";
    const FILE_PATH = "data.json";

    // ⚠️ 新しく発行した Personal Access Token (ghp_...) をここに貼り付けてください
    const GITHUB_TOKEN = "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";

    const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

    let reservedData = [];
    let currentSelectedSeat = null;

    // ページ読み込み時の初期化
    window.onload = async () => {
      renderSeats();
      await loadReservations();
    };

    // 座席グリッド（A1〜C5）を描画
    function renderSeats() {
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '';
      const seatNames = ['A1', 'A2', 'A3', 'A4', 'A5', 'B1', 'B2', 'B3', 'B4', 'B5', 'C1', 'C2', 'C3', 'C4', 'C5'];

      seatNames.forEach(seat => {
        const div = document.createElement('div');
        div.className = 'seat';
        div.id = `seat-${seat}`;
        div.innerText = seat;
        div.onclick = () => selectSeat(seat);
        grid.appendChild(div);
      });
    }

    // 座席クリック時の選択処理
    function selectSeat(seat) {
      const isReserved = reservedData.some(item => item.seat === seat && item.status !== 'cancelled');
      if (isReserved) {
        alert("この座席は既に予約されています。");
        return;
      }

      document.querySelectorAll('.seat').forEach(el => el.classList.remove('selected'));
      const target = document.getElementById(`seat-${seat}`);
      if (target) target.classList.add('selected');

      currentSelectedSeat = seat;
      document.getElementById('selectedSeat').value = seat;
    }

    // GitHubからの予約データ読み込み（認証ヘッダー付き）
    async function loadReservations() {
      const statusMsg = document.getElementById('statusMsg');
      try {
        const response = await fetch(`${API_URL}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, {
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3.raw"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        reservedData = await response.json();
        statusMsg.innerText = "最新データを取得しました。";
        statusMsg.style.color = "green";

        // 予約済みの座席を更新
        reservedData.forEach(item => {
          if (item.status !== 'cancelled') {
            const seatEl = document.getElementById(`seat-${item.seat}`);
            if (seatEl) {
              seatEl.classList.add('reserved');
              seatEl.innerText = `${item.seat}\n(予約済)`;
            }
          }
        });

      } catch (error) {
        console.error("データ取得エラー:", error);
        statusMsg.innerText = "GitHubからのデータ読み込みに失敗しました。PAT（トークン）が設定されているか確認してください。";
        statusMsg.style.color = "red";
      }
    }

    // 予約の送信処理
    async function submitReservation() {
      if (!currentSelectedSeat) {
        alert("座席を選択してください。");
        return;
      }

      const lastName = document.getElementById('lastName').value.trim();
      const firstName = document.getElementById('firstName').value.trim();
      const lastKana = document.getElementById('lastKana').value.trim();
      const firstKana = document.getElementById('firstKana').value.trim();
      const gradeClass = document.getElementById('gradeClass').value.trim();
      const studentId = document.getElementById('studentId').value.trim();
      const birthdate = document.getElementById('birthdate').value;

      if (!lastName || !firstName || !lastKana || !firstKana || !gradeClass || !studentId || !birthdate) {
        alert("すべての項目を入力してください。");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "予約を送信中...";

      try {
        // 更新用メタデータ（SHA）の取得
        const getRes = await fetch(API_URL, {
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (!getRes.ok) {
          throw new Error("GitHubメタデータの取得に失敗しました。");
        }

        const fileMetaData = await getRes.json();

        // 新規予約オブジェクト
        const newReservation = {
          reservationId: "RES" + Date.now(),
          seat: currentSelectedSeat,
          lastName,
          firstName,
          lastKana,
          firstKana,
          grade: gradeClass,
          studentId,
          birthdate,
          status: "reserved",
          createdAt: new Date().toISOString()
        };

        reservedData.push(newReservation);

        // UTF-8対応Base64エンコード
        const jsonString = JSON.stringify(reservedData, null, 2);
        const encodedContent = window.btoa(unescape(encodeURIComponent(jsonString)));

        // GitHub APIで保存
        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `新規予約: ${currentSelectedSeat} (${lastName} ${firstName})`,
            content: encodedContent,
            sha: fileMetaData.sha,
            branch: GITHUB_BRANCH
          })
        });

        if (!putRes.ok) {
          throw new Error("予約の保存に失敗しました。");
        }

        alert(`予約が完了しました！\n座席: ${currentSelectedSeat}`);
        location.reload();

      } catch (error) {
        console.error("予約エラー:", error);
        alert("予約の保存に失敗しました: " + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "予約を確定する";
      }
    }
  </script>

</body>
</html>
